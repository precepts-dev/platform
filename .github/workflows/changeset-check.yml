name: Changeset Check

# On every PR to main, remind contributors to add a changeset for intentional
# minor/major bumps. This is advisory only (continue-on-error: true) — the
# release job auto-creates a patch changeset if none is present, so PRs are
# never blocked. Add a changeset manually only when a minor or major bump is needed.

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".changeset/**"

jobs:
  changeset-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for changeset (advisory)
        run: pnpm changeset status --since=origin/main

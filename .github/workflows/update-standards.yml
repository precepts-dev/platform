name: Update @precepts/standards

on:
  repository_dispatch:
    types: [standards-published]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Update @precepts/standards
        run: pnpm update @precepts/standards

      - name: Create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          BRANCH="chore/update-standards-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pnpm-lock.yaml
          git commit -m "chore: update @precepts/standards to ${VERSION}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: update @precepts/standards to ${VERSION}" \
            --body "Auto-generated after @precepts/standards v${VERSION} was published to npm."

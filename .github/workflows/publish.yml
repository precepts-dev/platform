name: Publish and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Workflow runs in two modes depending on what's in .changeset/:
#
# Mode A — pending changeset files exist (e.g. after a feature PR is merged):
#   changesets/action creates or updates a "Version Packages" PR that bumps
#   package.json versions and writes CHANGELOGs. Nothing is published yet.
#
# Mode B — no pending changeset files (i.e. the "Version Packages" PR was just merged):
#   changesets/action runs `pnpm release` (= `changeset publish`), which
#   publishes packages whose current version is not yet on npm and creates
#   a GitHub Release per published package.
#
# The site is always built and deployed on every push to main, independently
# of which mode the release job is in.

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "publish-deploy"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate standards
        run: pnpm validate

      - name: Typecheck
        run: pnpm typecheck

  # Builds the Docusaurus site and uploads it as a Pages artifact.
  # Runs in parallel with the release job after validate passes.
  build-site:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm --filter @precepts/site build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/site/build

  deploy-site:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Handles changesets: either creates the "Version Packages" PR (Mode A)
  # or publishes packages to npm and creates GitHub Releases (Mode B).
  # Only builds the publishable packages (mcp-server); the site build is
  # handled separately by build-site above.
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm --filter @precepts/mcp-server build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          createGithubReleases: true
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

name: Publish and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Workflow runs two jobs in parallel after validate passes:
#
# release — auto-patches, versions, and publishes @precepts/mcp-server to npm.
#   If a manual changeset file is present it is used as-is (minor/major bumps);
#   otherwise a patch changeset is auto-created so every merge ships a release.
#
# build-site / deploy-site — builds and deploys the Docusaurus site to GitHub Pages.

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "publish-deploy"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate standards
        run: pnpm validate

      - name: Typecheck
        run: pnpm typecheck

  # Builds the Docusaurus site and uploads it as a Pages artifact.
  # Runs in parallel with the release job after validate passes.
  build-site:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm --filter @precepts/site build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/site/build

  deploy-site:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Auto-patch release: versions and publishes mcp-server on every merge to main.
  # If no changeset file is present, a patch bump is auto-created so every merge
  # ships a new version without requiring a manual `pnpm changeset` step.
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "24"  # Node 24 required for npm OIDC Trusted Publishing
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git for version commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Auto-create patch changeset if none present
        run: |
          CHANGESETS=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" | wc -l)
          if [ "$CHANGESETS" -eq 0 ]; then
            echo "No changeset found — auto-creating patch bump"
            printf -- '---\n"@precepts/mcp-server": patch\n---\n\nAutomated patch release\n' \
              > ".changeset/auto-patch-${GITHUB_RUN_ID}.md"
          fi

      - name: Version packages
        run: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build publishable packages
        run: pnpm --filter @precepts/mcp-server build

      - name: Publish to npm
        run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Push version bump commit
        run: |
          git add .
          git diff --staged --quiet || git commit -m "chore(release): version packages [skip ci]"
          git push

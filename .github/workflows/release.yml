name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          # Get the previous tag
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          CURR_TAG=${GITHUB_REF#refs/tags/}

          echo "## Standards Changes" > release-notes.md
          echo "" >> release-notes.md

          # List changed standard documents
          if [ -n "$PREV_TAG" ]; then
            echo "### Modified Standards" >> release-notes.md
            git diff --name-only "$PREV_TAG"..."$CURR_TAG" -- packages/site/docs/*/standards/ | while read -r file; do
              echo "- \`$file\`" >> release-notes.md
            done
            echo "" >> release-notes.md

            echo "### Modified Guidelines" >> release-notes.md
            git diff --name-only "$PREV_TAG"..."$CURR_TAG" -- packages/site/docs/*/guidelines/ | while read -r file; do
              echo "- \`$file\`" >> release-notes.md
            done
          else
            echo "Initial release." >> release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: true
